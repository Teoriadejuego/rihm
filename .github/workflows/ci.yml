name: Test classroom dashboard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Test, build and scan
        run: |
          Rscript scripts/run_tests.R
          npm test
          Rscript scripts/render_site.R
          Rscript scripts/scan_public.R
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Check student browser flows
        run: npm run test:e2e

