name: Validate and deploy classroom dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Limit optional OS packages only while installing R's setup tools.
      - name: Limit optional R setup packages
        run: echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99rihm-setup

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Restore APT defaults
        if: always()
        run: sudo rm -f /etc/apt/apt.conf.d/99rihm-setup

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run automated tests
        run: Rscript scripts/run_tests.R

      - name: Test the student reader
        run: npm test

      - name: Render static dashboard
        run: Rscript scripts/render_site.R

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check student browser flows
        run: npm run test:e2e:built

      - name: Scan the tested public artifact for private fields
        run: Rscript scripts/scan_public.R

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: student/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check this artifact still belongs to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_sha" = "$EXPECTED_SHA" || { echo 'A newer main commit exists; refusing an obsolete artifact.'; exit 1; }

      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
